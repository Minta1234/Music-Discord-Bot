name = "music-discord-bot-dash"
main = "src/index.js"
compatibility_date = "2023-10-30"

# All four secrets below must be set via `npx wrangler secret put <NAME>`:
#   BOT_API_URL        – public URL of your bot (e.g. https://xxx.up.railway.app)
#   DASHBOARD_PASSWORD – password for the web login page
#   SESSION_SECRET     – random string used to sign session cookies
#   BOT_SECRET         – token sent to the bot API as X-Bot-Secret header

